<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      font-family: Arial, sans-serif;
      color: white;
    }

    .loader-container {
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h2 {
      margin-top: 20px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <h2>Loading...</h2>
    <p>Please wait</p>
  </div>

</script>
</body>
</html>
